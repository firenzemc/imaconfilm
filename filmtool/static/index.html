<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>胶卷底片处理 · filmtool</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>胶卷底片处理 <span class="sub">Imacon FFF · 自动裁切 + 去色罩</span></h1>
  <div class="dirbar">
    <span class="lbl">目录</span><code id="curDir">/</code>
    <button id="btnPickDir">选择目录…</button>
    <span id="dirEmpty" class="hint hidden">该目录无 .fff 文件</span>
  </div>
  <div id="dirBrowser" class="dirBrowser hidden"></div>
  <div id="files" class="files"></div>
</header>

<main>
  <section id="stripPane" class="pane hidden">
    <div class="bar">
      <span id="stripTitle"></span>
      <label>比例
        <select id="ratio">
          <option value="free">自由(等分)</option>
          <option value="3:2">3:2 横（135）</option>
          <option value="2:3">2:3 竖（135）</option>
          <option value="4:5">4:5 竖</option>
          <option value="5:4">5:4 横</option>
          <option value="4.5:6">6×4.5 竖</option>
          <option value="6:6">6×6 方 (1:1)</option>
          <option value="7:6">6×7 横</option>
          <option value="9:6">6×9 横 (3:2)</option>
          <option value="custom">自定义…</option>
        </select>
      </label>
      <span id="customRatio" class="hidden">
        <input id="ratA" type="number" min="1" step="0.1" value="3" style="width:3.2em">
        :
        <input id="ratB" type="number" min="1" step="0.1" value="2" style="width:3.2em">
      </span>
      <label>帧数 <input id="frameCount" type="number" min="1" max="24" value="6" style="width:3.5em"></label>
      <button id="btnEven">等分排布</button>
      <button id="btnDetect">检测间隙</button>
      <label>缩放 <input id="zoom" type="range" min="1" max="6" step="0.25" value="1" style="width:90px"><output id="oZoom">1×</output></label>
      <span class="hint" id="stripHint"></span>
    </div>
    <div id="stripWrap" class="stripWrap">
      <div id="stripZoom" class="stripZoom">
        <img id="stripImg" draggable="false">
        <div id="overlay" class="overlay"></div>
      </div>
    </div>
  </section>

  <section id="editPane" class="pane edit hidden">
    <div class="frameView">
      <div class="bar">
        <span id="frameLabel">帧</span>
        <button data-rot="90">⟲90°</button>
        <button data-rot="-90">⟳90°</button>
        <button id="btnFlipH">↔水平翻转</button>
        <button id="btnFlipV">↕垂直翻转</button>
        <span class="pick">
          <button id="btnPickN" class="pick-btn">中性吸管</button>
          <button id="btnPickB" class="pick-btn">片基吸管</button>
        </span>
      </div>
      <div id="frameImgWrap" class="frameImgWrap">
        <img id="frameImg" draggable="false">
        <div id="pickHint" class="pickHint hidden"></div>
      </div>
    </div>

    <div class="controls">
      <label>模式
        <select id="mode"><option value="negative">负片</option><option value="positive">正片/反转</option></select>
      </label>
      <label>曝光 <input id="exposure" type="range" min="0.3" max="3" step="0.01" value="1"><output id="oExposure"></output></label>
      <label>对比度 <input id="contrast" type="range" min="0.5" max="2" step="0.01" value="1"><output id="oContrast"></output></label>
      <label>Gamma <input id="gamma" type="range" min="1" max="3" step="0.01" value="2.2"><output id="oGamma"></output></label>
      <label>黑场 <input id="black" type="range" min="0" max="0.2" step="0.005" value="0"><output id="oBlack"></output></label>
      <div class="wb">白平衡增益 R/G/B: <span id="wbVal">—</span>
        <button id="btnResetWb">重置</button></div>
      <div class="row">
        <button id="btnApplyAll">色彩应用到全部帧</button>
      </div>
      <hr>
      <div class="export">
        <label>导出模式
          <select id="expMode">
            <option value="finished">成片（反相 + 调色 · sRGB）</option>
            <option value="linear">线性正片（Capture One · 平片）</option>
            <option value="raw">未调色原片（生负片 · 留片基）</option>
          </select>
        </label>
        <div id="optFinished" class="exp-opt">
          <label><input type="checkbox" id="fmtJpg" checked> JPEG</label>
          <label><input type="checkbox" id="fmtTiff" checked> 16-bit TIFF</label>
        </div>
        <div id="optLinear" class="exp-opt hidden">
          <label>归一化
            <select id="linNorm">
              <option value="neutral">中性（灰世界 + 统一拉伸）</option>
              <option value="per_channel">每通道拉伸（更到位）</option>
            </select>
          </label>
        </div>
        <label class="odir">导出到目录
          <input id="outDir" type="text" placeholder="留空=输入文件旁；可填 C1 Hot Folder（相对根目录）">
        </label>
        <button id="btnExport" class="primary">导出全部帧</button>
        <div id="exportStatus" class="status"></div>
        <div class="hint" id="expHint"></div>
      </div>
    </div>
  </section>
</main>

<div id="toast" class="toast hidden"></div>
<script src="/app.js"></script>
</body>
</html>
